# Known-machine partition shapes — hardware facts only (no endpoints, no
# accounts, no queue state). Used by `python -m diamond_agent.auth init-sites`
# to pre-fill sites.live.yaml for systems it recognises from endpoint
# hostnames; every runtime resource comes from the live catalog + probes.
machines:
- name: Anvil@RCAC
  container_runtime: apptainer
  partitions:
  - name: gpu
    arch: x86_64
    gpu_type: A100
    gpus_per_node: 4
    gpu_mem_gb: 40
    cpus_per_node: 128
    mem_per_node_gb: 512
    nodes_total: 16
    max_walltime: '4:00:00'
  - name: ai
    arch: x86_64
    gpu_type: H100
    gpus_per_node: 4
    gpu_mem_gb: 80
    cpus_per_node: 96
    mem_per_node_gb: 1000
    nodes_total: 21
    max_walltime: '4:00:00'
