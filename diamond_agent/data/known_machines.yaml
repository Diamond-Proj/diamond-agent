# Known-machine partition shapes — hardware facts plus the site-dialect
# switches a machine's sbatch filter demands (no endpoints, no queue state;
# accounts only as TODO placeholders where the site mandates a suffix). Used
# by `python -m diamond_agent.auth init-sites` to pre-fill sites.live.yaml for
# systems it recognises from endpoint hostnames; every runtime resource comes
# from the live catalog + probes. Why each switch exists, per system:
# .claude/skills/diamond-agent-core/references/systems.md
machines:
- name: Anvil@RCAC
  container_runtime: apptainer
  partitions:
  - name: gpu
    arch: x86_64
    gpu_type: A100
    gpus_per_node: 4
    gpu_mem_gb: 40
    cpus_per_node: 128
    mem_per_node_gb: 512
    nodes_total: 16
    max_walltime: '4:00:00'
