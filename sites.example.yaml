# Example site catalog — copy to sites.live.yaml and fill in your endpoint UUIDs
# (make endpoints). Accounts are read live from Slurm (DefaultAccount); add
# `accounts: [...]` to pin one, and fill the per-partition sub-accounts a site
# demands (TODO below). sites.live.yaml is git-ignored.
#
# Every system is reached through a Globus Compute endpoint YOU own, running on
# that system's login node (make endpoint-setup HOST=<you>@<login host>): probes
# and sbatch run there directly, no worker queueing, nothing to configure per
# user. Multi-user endpoints are not supported (they need account/partition
# worker placement and their workers ride a batch queue).

systems:
  - name: Delta@NCSA
    endpoint: <endpoint-uuid>   # diamond-agent endpoint on login.delta.ncsa.illinois.edu
    container_runtime: apptainer
    partitions:
      - name: gpuA100x4
        account: TODO-your-allocation
        arch: x86_64
        gpu_type: A100
        gpus_per_node: 4
        gpu_mem_gb: 40
        cpus_per_node: 64
        mem_per_node_gb: 256
        nodes_total: 100
        max_walltime: "4:00:00"
      - name: gpuA40x4
        account: TODO-your-allocation
        arch: x86_64
        gpu_type: A40
        gpus_per_node: 4
        gpu_mem_gb: 48
        cpus_per_node: 64
        mem_per_node_gb: 256
        nodes_total: 100
        max_walltime: "4:00:00"
      - name: cpu
        account: TODO-your-allocation
        arch: x86_64
        gpu_type: null
        gpus_per_node: 0
        gpu_mem_gb: 0
        cpus_per_node: 128
        mem_per_node_gb: 256
        nodes_total: 132
        max_walltime: "4:00:00"

  # ---- DeltaAI@NCSA — login-node endpoint on gh-login01 (aarch64), verified.
  # Node shape via scontrol: Gres=gpu:nvidia_gh200_120gb:4, 288c, 476GB, ~150 nodes.
  - name: DeltaAI@NCSA
    endpoint: <endpoint-uuid>   # diamond-agent (gh-login01)
    container_runtime: apptainer
    partitions:
      - name: ghx4
        arch: aarch64
        gpu_type: GH200
        gpus_per_node: 4
        gpu_mem_gb: 120
        cpus_per_node: 288
        mem_per_node_gb: 476
        nodes_total: 150
        max_walltime: "4:00:00"
      # also exists: ghx4-interactive (2h cap), test, full — add if needed

  # ---- Anvil@RCAC — login-node endpoint, verified via `auth endpoints`.
  # NB: each Anvil account is bound to one mandatory QOS (sacctmgr association
  # table) — the per-partition `qos` is injected as #SBATCH --qos.
  - name: Anvil@RCAC
    endpoint: <endpoint-uuid>   # diamond-agent (login03.anvil)
    container_runtime: apptainer
    partitions:
      - name: gpu
        account: TODO-your-allocation
        qos: gpu
        arch: x86_64
        gpu_type: A100
        gpus_per_node: 4
        gpu_mem_gb: 40
        cpus_per_node: 128
        mem_per_node_gb: 512
        nodes_total: 16
        max_walltime: "4:00:00"
      - name: ai              # verified via scontrol: h[000-020], Gres=gpu:4, 96c, ~1TB
        account: TODO-your-allocation
        qos: ai
        arch: x86_64
        gpu_type: H100
        gpus_per_node: 4
        gpu_mem_gb: 80
        cpus_per_node: 96
        mem_per_node_gb: 1000
        nodes_total: 21
        max_walltime: "4:00:00"

  # ---- Vista@TACC — login-node endpoint on login2 (aarch64), verified live.
  # Node counts from the live sinfo probe (gh 576, gg 251, gh-dev 20).
  # TACC allocates whole nodes and rejects --mem => mem_directive: false.
  - name: Vista@TACC
    endpoint: <endpoint-uuid>   # diamond-agent (login2.vista)
    container_runtime: apptainer
    mem_directive: false
    gpu_directive: false   # whole-node allocation; gres directives are rejected
    # TACC's submit filter validates the PORTAL project name (uppercase);
    # sacctmgr reports it lowercase, so the live account is upper-cased.
    account_case: upper
    partitions:
      - name: gh
        arch: aarch64
        gpu_type: GH200
        gpus_per_node: 1
        gpu_mem_gb: 96
        cpus_per_node: 72
        mem_per_node_gb: 120
        nodes_total: 576
        max_walltime: "4:00:00"
      - name: gh-dev            # dev queue: fast turnaround, ideal for smoke tests
        max_nodes_per_job: 2    # per-queue cap (overrides policy.max_nodes_per_job)
        arch: aarch64
        gpu_type: GH200
        gpus_per_node: 1
        gpu_mem_gb: 96
        cpus_per_node: 72
        mem_per_node_gb: 120
        nodes_total: 20
        max_walltime: "4:00:00"
      - name: gg                # Grace-Grace CPU nodes
        arch: aarch64
        gpu_type: null
        gpus_per_node: 0
        gpu_mem_gb: 0
        cpus_per_node: 144
        mem_per_node_gb: 240
        nodes_total: 251
        max_walltime: "4:00:00"
      # gb (Grace-Blackwell, 18 nodes) exists — add once allocation access is confirmed

# Scheduling limits (operator policy). max_nodes_per_job is the DEFAULT per-job
# node cap; any partition above may carry its own `max_nodes_per_job: N`. The
# operator can also set per-queue caps, the pending cap and blocked queues in
# the web UI (Overview → Machine rules): those are persisted in the service database and
# override this file without rewriting it. Agents can read the limits
# (`diamond-agent-core policy`, GET /api/policy) but never change them.
policy:
  max_user_pending_per_system: 4
  max_nodes_per_job: 8
  blocked_partitions: []          # ["Delta@NCSA:gpuA100x8"]

